Talks::Talk_d80ef2eb-a057-486d-af62-d5441713f3f0:
  id: d80ef2eb-a057-486d-af62-d5441713f3f0
  description: "Hypermedia frameworks like htmx or Unpoly are positioning themselves
    as simpler alternatives to single-page applications. Yet many of us recall earlier
    server-rendered experiences as slow, cumbersome and limited. But just as modern
    React is unrecognizable from its early days, hypermedia frameworks have improved
    radically over the last decade. Today's server-rendered approaches effectively
    handle UI problems traditionally thought to require extensive client-side scripting.
    At the same time, hypermedia apps have some surprising limitations that you might
    not even have on your radar.\r\nThis talk will help you decide whether adopting
    hypermedia makes sense for your project, especially if your experience is mostly
    with SPAs. We will address questions frontend developers typically have:\r\n-
    Is it possible to achieve the same responsiveness that users have come to expect
    from SPAs?\r\n- How would dynamic forms with dependent fields and inline validation
    work without extensive JavaScript?\r\n- Can server-side rendering manage intricate
    UI interactions, such as multi-step modals, optimistic rendering, and client-side
    state preservation?\r\n- Where does state go when I don't have components on the
    client?\r\nAfter ten years of building both hypermedia apps and SPAs, I'm eager
    to share what works and what doesn't. I hope that by the end of my talk you'll
    know all the trade-offs to decide when hypermedia can simplify your stack, and
    when an SPA remains the better fit."
  events_event_id: e0e0c374-65e9-4652-9b0e-22011412a820
  kind: talk
  language_code: en
  position: 1
  rubyevents_slug: ''
  slides_url: ''
  slug: limits-of-hypermedia
  title: Limits of Hypermedia
