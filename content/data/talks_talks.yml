Talks::Talk_097ea9bd-b75f-4ee5-8ce8-935902d7faca:
  id: '097ea9bd-b75f-4ee5-8ce8-935902d7faca'
  description: "In this demo-heavy \"talk & deploy\" I do a classic Ruby on Rails
    speedrun. How fast can you get from an empty git repo to a deployed website?\r\n\r\nHowever,
    nothing is as it seems. While frantically switching between slides and code editor,
    I will reveal and explain my two new gems and will use them to turn a new Ruby
    on Rails project into a very weird static site generator.\r\n\r\nWe'll create
    the initial DB tables and add some records ... wait, what? Database tables? In
    a static site generator??? Yes, you heard me right!\r\n\r\nAfterwards, we'll have
    our tiny release party! At least, if the internet connection is stable. Wish me
    luck!"
