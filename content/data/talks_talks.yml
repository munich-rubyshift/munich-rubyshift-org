  id: fbe6a73f-c172-4cd8-919d-3f3e582e63b0
  description: "We've got Ruby 2 since some months, Ruby 2.1 just released, and a
    bunch of legacy code bases require some older Ruby versions... that can quickly
    become a mess. In this talk, I want to explore some part of the Ruby ecosystem
    that deals with infrastructure: Chef and Vagrant.\r\n\r\nAbout the speaker: I
    am very much interested in all things Unix, and good OOP (often in Ruby). I am
    also impressed by the performance of Node.js, and new approaches for client-server
    architectures. I blog at http://thinkingonthinking.com and am working currently
    on a book \"Developing Web Applications with Backbone.js\"."
