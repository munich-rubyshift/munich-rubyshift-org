Talks::Talk_b5eed5e5-c25d-44ee-a8aa-6c137e3bb1eb:
  id: b5eed5e5-c25d-44ee-a8aa-6c137e3bb1eb
  description: "At the time of product launch, our most important API endpoint was
    taking around 5 seconds in production. It wasn’t related to tech-stack or a particular
    database/cloud issue nor did we have very bad code quality or any N+1 query issues.
    Instead, it turned out to be the cumulative result of small mistakes in some services.
    In this talk, we will see how we arrive at those mistakes, and how you can avoid
    them earlier on in the development process.\r\n\r\nAbout our speaker\r\nRaounak
    has been working with Ruby for the past 5 years, and actively contributing to
    the Ruby community since 2018. This time has made him focus more on the performance
    of the software. He has implemented and led projects in the performance optimization
    area as a senior software engineer. Recently he has moved to Dresden, Germany
    and is looking forward to meeting new people."
  events_event_id: 7756b666-da89-4f60-9947-cbb5d3110256
  kind: talk
  language_code: en
  position: 1
  rubyevents_slug: ''
  slides_url: ''
  slug: how-we-reduced-its-public-api-s-response-time-by-86
  title: How we reduced its public API's response time by 86%
