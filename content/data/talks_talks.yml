Talks::Talk_2e0e8a82-1b67-4fc4-9e2a-7379f96661cf:
  id: 2e0e8a82-1b67-4fc4-9e2a-7379f96661cf
  description: "When I started working with Ruby, I embraced its rich ecosystem. My
    Gemfile for any new project immediately grew longer than Gandalf's beard. Unfortunately,
    using Gems comes with downsides. On the practical side, pulling in third-party
    libraries exposes your app to supply-chain attacks that are increasingly common.
    However, what's even worse is that most Gems are pure bloatware. They add thousands
    of lines of code you'll never need, and churn constantly.\r\nThe alternative,
    obviously, is to build everything from scratch. In this talk, we'll look at some
    examples of how some well-known gems can be boiled down to a single file that
    you can copy-paste to any new project. We'll also look at the limits of this approach,
    and when you actually should reach for that Gem."
  events_event_id: e6c4cb5e-4d7f-4cf6-96b1-18691856aa88
  kind: talk
  language_code: en
  position: 1
  rubyevents_slug: ''
  slides_url: ''
  slug: gems-are-overrated-or-how-i-learned-to-stop-worrying-and-love-copy-pasting
  title: 'Gems Are Overrated: or How I Learned to Stop Worrying and Love Copy-Pasting'
