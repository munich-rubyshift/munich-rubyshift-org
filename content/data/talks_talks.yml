  id: a1b8139a-74c3-47b1-9763-a7a011e0caf8
  description: "Zavvy has grown from a simple Rails app to a huge suite of B2B applications
    all served with a single Rails app with ~150 API endpoints, models and presenters
    with a complex inter-connection between apps. As a startup speed of release is
    crucial, quality is not a tradeoff, security with complex authenticate and authorization
    logic is a must. This has not been easy but we are proud of what we setup as our
    best practices/standards and we would like to show you how we kept things simple
    and made it very easy to achieve all these goals.\r\n\r\nAbout our speaker\r\nSri
    Vishnu Totakura is the CTO of Zavvy."
