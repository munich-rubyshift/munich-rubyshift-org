Talks::Talk_c4554c01-65ff-4d67-8050-771c527618ae:
  id: c4554c01-65ff-4d67-8050-771c527618ae
  description: "ArangoDB is an open source NoSQL database which is not narrow-mindedly
    focused on horizontal scalability. Instead, ArangoDB aims to offer developers
    great flexibility and ease-of-use. The database is suitable for use cases which
    are difficult to implement with most traditional relational databases and also
    many of the other NoSQL databases.\r\n\r\nI’m a member of the core team of the
    NoSQL database project ArangoDB where I work on the graph functionality, tools
    for the Ruby community to use the database and Foxx. Furthermore I contribute
    to various open source projects like hacken.in (http://hacken.in/) (an event calender
    for nerds in my hometown written in Rails) and projects related to ArangoDB. You
    can find me listening or speaking at our local usergroups for Ruby, JavaScript,
    NoSQL and (as a coach for) Rails Girls."
