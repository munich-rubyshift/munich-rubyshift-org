Talks::Talk_407ce9e5-f3d7-40ee-84e1-386737f901fb:
  id: 407ce9e5-f3d7-40ee-84e1-386737f901fb
  description: "Complex data filtering in Rails often leads us down a rabbit hole
    of custom scopes, service objects, and Arel acrobatics. But what if we let the
    database do what it’s best at? In this talk, you’ll see how SQL views paired with
    plain ActiveRecord and Ransack can turn messy logic into elegant, powerful queries
    — without giving up the Rails way.\r\n\r\nAbout our speaker\r\nClemens Helm is
    a seasoned Rails developer from Vienna who believes good code is boring — in the
    best way. At railscraft.de, he helps teams modernize legacy Rails apps with clean
    architecture, sharp tools, and zero-nonsense pragmatism."
  events_event_id: 969902ff-c7e8-48e5-8d0e-f64c85568e63
  kind: talk
  language_code: en
  position: 2
  rubyevents_slug: ''
  slides_url: https://github.com/clemenshelm/rubyshop
  slug: using-database-views-in-rails-and-why-you-should-or-shouldn-t-do-it
  title: Using database views in Rails and why you should (or shouldn't) do it
