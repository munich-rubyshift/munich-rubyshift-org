  description: |-
    Dear Munich Rubyists,

    the leaves are turning brown again, so it's high time for this year's November edition of our meetup!

    This time, Experteer GmbH will be our hosts for location, food & drinks. Thank you Shota for establishing the contact!

    Looking forward to seeing you all in November!

