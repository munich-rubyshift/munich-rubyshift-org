Events::Event_31dfb46b-8e9e-4941-92e9-d429d53f6eaa:
  id: 31dfb46b-8e9e-4941-92e9-d429d53f6eaa
  attendance_mode: in_person
  banner_background: ''
  channel_id: ''
  date_precision: day
  description: "Dear Munich Rubyists,\r\n\r\nthe year is coming to an end – which
    means, it's almost time for the first Meetup of 2024!\r\n\r\nJust like in 2023,
    our friends from Freeletics will be the hosts of the year's frist meetup! One
    of the talks will be given by yours truly -- I'll talk about simplifying our overall
    backend/frontend setups using InertiaJS. The 2nd talk is currently TBD -- we might
    have one from our hosts themselves, but if you do have something ready to go,
    please get in touch. :-)\r\n\r\nDATE & LOCATION\r\n\r\nDate and Time: January
    11, from 19:00 CEST\r\nLocation: Freeletics GmbH, Berg-Am-Laim-Strasse 111, 81673
    Munich\r\n\r\nAGENDA\r\n\r\n    Welcome & Announcements\r\n    Location/Food &
    Drinks Sponsor Slot\r\n    Talk 1 incl. Q&A: Clemens Kofler: \"Inertia -- The
    healthy middleground between a Rails Monolith and a Single Page Application?\"\r\n
    \   Break\r\n    Talk 2 incl. Q&A: Khaled Muamar: \"Intuitive Client Errors Driven
    by Backend\"\r\n    Food & Drinks (sponsored by Freeletics), Socializing (open
    end/as long as the location permits)\r\n\r\nTALKS\r\n\r\nTalk 1: \"Inertia --
    The healthy middleground between a Rails Monolith and a Single Page Application?\"\r\nCan
    we strike a balance between the simplicity of a Rails Monolith and the flexibility
    that a Single Page Application? And can we do so while keeping both Backend Rubyists
    and Frontend React/Vue people reasonably happy? Let's find out together.\r\nAbout
    our speaker\r\nClemens Kofler is a Director of Engineering at DataGuard.\r\n\r\nTalk
    2: \"Intuitive Client Errors Driven by Backend\"\r\nAbout our speaker\r\nKhaled
    Muamar is a Backend Engineer at Freeletics."
