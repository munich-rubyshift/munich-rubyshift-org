  id: e3c8c4b9-ec5a-418e-b860-15bdc0ba77cd
  attendance_mode: in_person
  banner_background: ''
  channel_id: ''
  date_precision: day
  description: "Dear Munich Rubyists,\r\n\r\nthe year is coming to an end – which
    means, it's almost time for the first Meetup of 2023!\r\n\r\nThis time, our friends
    from Freeletics will be the hosts, who will also give one of the talks of the
    evening. (If you're interested in giving the other talk or know someone who would
    be interested, please get in touch!)\r\n\r\nAlso, at request of several people,
    we'll bring back the Ruby News segment – I'll give you a handful of my picks of
    the most relevant things that happened in the world of Ruby since the previous
    meetup. Let's see how it goes. ;-)\r\n\r\nDATE & LOCATION\r\n\r\nDate and Time:
    January 12, from 19:00 CEST\r\nLocation: Freeletics GmbH, Berg-Am-Laim-Strasse
    111, 81673 Munich\r\n\r\nAGENDA\r\n\r\n    Welcome & Announcements\r\n    Location/Food
    & Drinks Sponsor Slot\r\n    Talk 1 incl. Q&A: Khaled Muamar: \"Moving from Rails
    Secret to Environment Variables\"\r\n    Break / Ruby News\r\n    Talk 2 incl.
    Q&A: Dmytro Khmelenko: \"Type Management in Ruby\"\r\n    Food & Drinks (sponsored
    by Freeletics), Socializing (open end/as long as the location permits)\r\n\r\nTALKS\r\n\r\nTalk
    1: \"Moving from Rails Secret to Environment Variables\"\r\nAbout our speaker\r\nKhaled
    Muamar is a Senior Backend Developer at Freeletics.\r\n\r\nTalk 2: \"Type Management
    in Ruby\"\r\nAbout our speaker\r\nDmytro Khmelenko is a Software Engineer at Shopify.
    He's also the author of the book \"Unlock the Code: The Ultimate Guide to Advancing
    from Junior to Senior Software Engineer in 7 Actionable Steps\" (https://www.amazon.com/dp/B098LNMFCJ)."
