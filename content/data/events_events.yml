Events::Event_ac48d30d-2724-434c-815e-6853b1f10109:
  id: ac48d30d-2724-434c-815e-6853b1f10109
  attendance_mode: in_person
  banner_background: ''
  channel_id: ''
  date_precision: day
  description: "\U0001F3A4 Jan Krutisch – Updating Dependencies sucks, so let's do
    more of that\r\n\r\nI would like to tell you about Depfu and why we believe in
    doing dependency updates more often. But also have a discussion about how everyone
    is dealing with keeping their app up-to-date and other maintenance tasks as part
    of their development process.\r\n\r\n\U0001F3A4 Austin Moore – Ruby + Kafka: The
    Devil is in Details\r\n\r\nxbAV is just starting to use Kafka. We'd like to share
    some of the pitfalls we've run into so far, so you can avoid them."
