  banner_background: ''
  channel_id: ''
  date_precision: day
  description: "Dear Munich Rubyists,\r\n\r\nI wish you all happy 2025 -- I hope you're
    having great holidays with your loved ones!\r\n\r\nAfter a rather slow year 2024
    in terms of meetups, let's revive this in 2025, shall we? :-)\r\n\r\nLike last
    year, our friends from Freeletics have agreed to host the first meetup of the
    new year with location and snacks & drinks. They'll also have a talk lined up
    and you'll find the speaker and topic as soon as it's finalized here in the event
    notes. If you're up for a talk yourself, let me know -- there's always room for
    a second one, especially after the longer break that we just had!\r\n\r\nAt this
    time, I'm also still looking for 1-2 talks. Maybe from you? ;-) Get in touch!\r\n\r\nDATE
    & LOCATION\r\n\r\nDate and Time: January 16, from 19:00 CEST\r\nLocation: Freeletics
    GmbH, Berg-Am-Laim-Strasse 111, 81673 Munich\r\n\r\nAGENDA\r\n\r\n    Welcome
    & Announcements\r\n    Location/Food & Drinks Sponsor Slot\r\n    Talk 1 incl.
    Q&A: \"How a 502 Error led us to cut resource usage by over 30%\", Khaled Muamar,
    Senior Software Engineer @ Freeletics\r\n    Talk 2 incl. Q&A: TBD\r\n    Food
    & Drinks (sponsored by Freeltics), Socializing (open end/as long as the location
    permits)\r\n\r\nTALKS\r\n\r\nTalk 1: How a 502 Error led us to cut resource usage
    by over 30%\r\nAbout our speaker\r\nKhaled Muamar is a Senior Software Engineer
    at Freeletics.\r\n\r\nTalk 2: TBD\r\nAbout our speaker\r\nYou? ;-)"
