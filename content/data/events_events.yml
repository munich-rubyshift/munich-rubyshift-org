  attendance_mode: in_person
  date_precision: day
  description: |-
    Dear Munich Rubyists,

    I wish you all happy 2025 -- I hope you're having great holidays with your loved ones!

    After a rather slow year 2024 in terms of meetups, let's revive this in 2025, shall we? :-)

    Like last year, our friends from Freeletics have agreed to host the first meetup of the new year with location and snacks & drinks. They'll also have a talk lined up and you'll find the speaker and topic as soon as it's finalized here in the event notes. If you're up for a talk yourself, let me know -- there's always room for a second one, especially after the longer break that we just had!

    At this time, I'm also still looking for 1-2 talks. Maybe from you? ;-) Get in touch!

    Agenda:
    - Welcome & Announcements
    - Location/Food & Drinks Sponsor Slot
    - Talk 1: Khaled Muamar
    - Break
    - *OPEN TALK SLOT*
    - Food & Drinks (sponsored by Freeltics), Socializing (open end/as long as the location permits)
