Events::Event_adea8129-c6f0-48b1-b764-296c09336343:
  id: adea8129-c6f0-48b1-b764-296c09336343
  attendance_mode: in_person
  banner_background: ''
  channel_id: ''
  date_precision: day
  description: "Dear Munich Rubyists,\r\n\r\nwere closing in on Episode 2 of 2023's
    meetups!\r\n\r\nThis time, we'll visit Zavvy, who will host the meetup and also
    give one of the talks of the evening. We'll also have Hanami's creator Luca Guidi
    joining us from remote as a special guest to give us a tour of Hanami 2.0.\r\n\r\nDATE
    & LOCATION\r\n\r\nDate and Time: March 9, from 19:00 CEST\r\nLocation: Zavvy GmbH
    (@Mindspace), Herzogspitalstraße 24, 80331 Munich\r\n\r\nAGENDA\r\n\r\n    Welcome
    & Announcements\r\n    Location/Food & Drinks Sponsor Slot\r\n    Food & Drinks
    (sponsored by Zavvy)\r\n    Talk 1 incl. Q&A: Luca Guidi: \"Hanami 2.0: a framework
    for a new Ruby era\"\r\n    Break\r\n    Talk 2 incl. Q&A: Sri Vishnu Totakura:
    \"Best practices we employ for a scalable Rails app\"\r\n    Socializing (open
    end/as long as the location permits)\r\n\r\nTALKS\r\n\r\nTalk 1: \"Hanami 2.0:
    a framework a new Ruby era\"\r\nNote: This talk will be held remotely\r\n\r\nAbout
    our speaker\r\nLuca Guidi is a Backend Architect at Toptal and the creator of
    the Hanami framework.\r\n\r\nTalk 2: \"Best practices we employ for a scalable
    Rails app\"\r\nZavvy has grown from a simple Rails app to a huge suite of B2B
    applications all served with a single Rails app with ~150 API endpoints, models
    and presenters with a complex inter-connection between apps. As a startup speed
    of release is crucial, quality is not a tradeoff, security with complex authenticate
    and authorization logic is a must. This has not been easy but we are proud of
    what we setup as our best practices/standards and we would like to show you how
    we kept things simple and made it very easy to achieve all these goals.\r\n\r\nAbout
    our speaker\r\nSri Vishnu Totakura is the CTO of Zavvy."
  end_time: '2000-01-01 19:00:00'
  events_series_id: 1659b292-15b3-4b8a-9f61-3f4359c74e3a
