  attendance_mode: in_person
  banner_background: ''
  channel_id: ''
  date_precision: day
  description: "\U0001F3A4 Kivanc Semen und Ference Brose – Ruby in Legal Tech: An
    Evening at DataGuard\r\n\r\nThe leading legal tech company DataGuard invites you
    to get to know the machine learning supported platform (reference number at the
    European Patent Office: Q0144EP). Founder and managing director Kivanc Semen and
    Ference Brose will give exciting insights and look forward to discussion and exchange
    with the guests. Food and drinks will of course be provided.\r\n\r\nKivanc Semen
    reports on his experience as an entrepreneur and how the idea for a technology-based
    approach to data protection came about.\r\nFerence Brose looks behind the curtain
    of the platform and explains how DataGuard's technology works and what role Ruby
    plays.\r\n\r\n\U0001F3A4 Dino Reic – Pure JS components in Ruby/Rails server-rendered
    pages\r\n\r\nHow to easily integrate Svelte, React, Vue or your custom widgets
    in your workflow\""
