Events::Event_bd09e5ca-d692-409c-8944-d966c2a175e0:
  id: bd09e5ca-d692-409c-8944-d966c2a175e0
  attendance_mode: in_person
  banner_background: ''
  channel_id: ''
  date_precision: day
  description: "Dear Munich Rubyists,\r\n\r\nwill be nice to see you all again on
    16.10.\r\n\r\nThe meetup will take place at Lanes & Planes GmbH and the food is
    sponsored by Ruby Central.\r\n\r\nWe have two interesting talks. One from Chikahiro
    \"Is the monolith a problem?\" and another from Klaus - \"A resource-oriented
    file structure for Rails\".\r\n\r\nOn a personal note: This is the first event
    that I am organizing since I took over the group from Clemens. If anyone wants
    to help organize it or become a co-organizer of the group, please contact me.\r\n\r\nDiscord
    group: https://discord.gg/EKqHWmCxGZ\r\n\r\nLooking forward to seeing you all
    in October!\r\n\r\nDATE & LOCATION\r\n\r\nDate and Time: October 16, from 19:00
    CEST\r\nLocation: Lanes & Planes\r\n\r\nAGENDA\r\n\r\n    Welcome & Announcements\r\n
    \   Location/Food & Drinks Sponsor Slot\r\n    Talk 1 incl. Q&A: Chikahiro: \"Is
    the monolith a problem?\"\r\n    Talk 2 incl. Q&A: Klaus: Lightning Talk - \"A
    resource-oriented file structure for Rails\"\r\n    Food & Drinks (sponsored by
    Ruby Central), Socializing (open end/as long as the location permits)\r\n\r\nTALKS\r\n\r\nTalk
    1: Chikahiro: \"Is the monolith a problem?\"\r\nDiscover the truth about monoliths
    vs microservices! Debunk myths, uncover real architectural differences, and learn
    strategies to fix the real problems — not just follow trends.\r\nAbout our speaker
    https://www.linkedin.com/in/chikahiro\r\n\r\nTalk 2: Klaus: Lightning Talk - \"A
    resource-oriented file structure for Rails\"\r\nAbout the speaker https://www.linkedin.com/in/klaus-weidinger-a37a27332/"
  end_time: '2000-01-01 20:00:00'
  events_series_id: 1659b292-15b3-4b8a-9f61-3f4359c74e3a
