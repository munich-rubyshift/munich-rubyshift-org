Events::Event_bfa2ec55-241f-4129-a1bf-92dfa03c543c:
  id: bfa2ec55-241f-4129-a1bf-92dfa03c543c
  attendance_mode: in_person
  banner_background: ''
  channel_id: ''
  date_precision: day
  description: "Dear Munich Rubyists,\r\n\r\nthe September edition of our meetup is
    coming!\r\n\r\nBefore diving into the details, let me start with an apology: On
    fairly short notice, I unfortunately couldn't attend the last meetup at our friends
    from Experteer due to a family-related issue. This unfortunately coincided with
    a meetup where we had no talk lined up, so I couldn't even give the backup talk
    that I had prepared. From what I heard from our host Valentin, it was still a
    nice meetup with interesting conversations -- but I'm still sorry that the meetup
    didn't go as planned.\r\n\r\nAnyway, back to the topic at hand: The September
    meetup!\r\n\r\nThis time, Le Wagon Munich will be our host for location, food
    & drinks and they'll also have their own Bruno Brunckhorst give a talk about using
    Neural Networks with Ruby/Rails.\r\n\r\nI'm also looking for an optional 2nd speaker
    to give a short(er) talk in addition to the main talk => let me know if you're
    interested or know someone who might be interested.\r\n\r\nDATE & LOCATION\r\n\r\nDate
    and Time: September 14, from 19:00 CEST\r\n\r\nLocation: Le Wagon Munich, Balanstrasse
    73, building 21A, 4th floor, 81541 Munich, Germany\r\n\r\nAs the neue Balan campus
    is quite extensive, here some tips to make sure everyone gets here without issues:\r\n\r\nThe
    easiest way to locate us is to pop the location in Google Maps, the pin is very
    accurate.\r\n\r\nWhen coming by U-Bahn (Karl Preis Platz) take the entrance onto
    the campus from Claudius Keller Straße. after 150meters, you will find Haus 21A
    on your left hand side.\r\n\r\nFor those arriving by car, there is a large parking
    garage located on campus, by the northern entrance (St. Martin Straße 112).\r\n\r\nAGENDA\r\n\r\n
    \   Welcome & Announcements\r\n    Location/Food & Drinks Sponsor Slot\r\n    Food
    & Drinks (sponsored by Le Wagon)\r\n    Talk 1 incl. Q&A: Rails Unwired: Neural
    Networks in Ruby (Bruno Brunckhorst, Program Manager & Data Scientist @ Le Wagon)\r\n
    \   Break\r\n    Talk 2 incl. Q&A: TBD\r\n    Socializing (open end/as long as
    the location permits)\r\n\r\nTALKS\r\n\r\nTalk 1: Rails Unwired: Neural Networks
    in Ruby\r\n\r\nThis will be a beginner-friendly talk on the topic of Neural Networks
    and how to connect them with Ruby/Rails.\r\n\r\nAbout our speaker\r\n\r\nBruno
    Brunckhorst is a Program Manager & Data Scientist at Le Wagon in Munich.\r\n\r\nTalk
    2: TBD\r\n\r\nAbout our speaker\r\n\r\nYou? :-)"
  end_time: '2000-01-01 19:00:00'
