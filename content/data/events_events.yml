  attendance_mode: in_person
  banner_background: ''
  channel_id: ''
  date_precision: day
  description: "Hi,\r\n\r\nwe have again assembled wonderful speakers and topics -\r\nplease
    join us and have fun together.\r\n\r\n'Fast and furious. Slow and functional'
    Anna BulenkovaHow Anna benchmarked declarative and imperative solutions in Ruby.\r\n\r\nJRuby:
    the business perspectiveLeif GensertJRuby is often portrayed as the Ruby with
    brilliant Garbage Collection and native threads but poor startup time and large
    memory overhead. But how can JRuby really help you in a project, especially when
    you deal with large corporations that live in the Java world.\r\n\r\nDesign Patterns
    - A Ruby PerspectiveMathias Huber\r\nI'll give a digest of Russ Olsen's 2007 book
    \"Design Patterns in Ruby\". It applies 14 of the 23 \"Gang of Four\" patterns
    to Ruby and suggests 3 additional Ruby-specific patterns. In the discussion part
    you are invited to talk about your favourite pattern or your least favourite pattern,
    antipatterns, enterprise patterns, maybe why you don't like patterns ...\r\n\r\nciao
    robertj & alex"
