Events::Event_764df804-c67c-4803-84b3-4221968642fb:
  id: 764df804-c67c-4803-84b3-4221968642fb
  attendance_mode: in_person
  banner_background: ''
  channel_id: ''
  date_precision: day
  description: "We have drinks, food, and a great line-up of talks:\r\n\r\nMathias
    Huber: \"Exercism.io\"\r\nA fun web community for practicing Ruby and other languages
    with feedback from your peers.\r\n\r\nChristian Mager (HiQ5.com): \"NANUQ3 CloudCMS\"\r\nA
    CMS (http://www.nanuq3.com) developed in Ruby on Rails.\r\n\r\nDennis Herr (TUM,
    experteer.com): \"Experella-Proxy, a load balancing reverse proxy\"\r\nService-oriented
    architectures can be quite tricky to handle. Routing logic is hard to setup or
    modify and often needs to be configured in a low-level programming language. So
    we decided to build a load balancing reverse proxy in Ruby. The presentation will
    cover motivation & requirements to build a reverse proxy, simple use cases, an
    introduction to Experella-Proxy and features to aim for.\r\n\r\nAfter the talks
    you are invited to help yourself to some more drinks, socialize, and talk about
    the conferences you will be attending this year (you can find some at http://rubyconferences.org­)"
  end_time: '2000-01-01 20:00:00'
