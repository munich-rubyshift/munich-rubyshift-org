Events::Event_7756b666-da89-4f60-9947-cbb5d3110256:
  id: 7756b666-da89-4f60-9947-cbb5d3110256
  attendance_mode: in_person
  banner_background: ''
  channel_id: ''
  date_precision: day
  description: "Dear Munich Rubyists,\r\n\r\nI don't know about you, but I think it's
    high time that we meet again!\r\n\r\nThe first meetup in almost 2 years has been
    tentatively scheduled for July 14. (I've moved it from the 2nd Wednesday to the
    2nd Thursday of the month, because several people in the past have mentioned that
    Wednesday isn't ideal.)\r\n\r\nDATE & LOCATION\r\n\r\nDate and Time: July 14,
    from 19:00 CEST\r\nLocation: DataGuard Office (5th Floor), Dachauer Str. 65, 80335
    Munich\r\n\r\nAGENDA\r\n\r\n    Welcome & Announcements (10')\r\n    Location/Food
    & Drinks Sponsor Slot (5')\r\n    Raounak Sharma: How we reduced its public API's
    response time by 86% (45')\r\n    Talk incl. Q&A (15‘, intended for 1st time/inexperienced
    speaker)\r\n    Food & Drinks (sponsored by DataGuard), Socializing (open end/as
    long as the location permits)\r\n\r\nTALKS\r\nTalk 1: How we reduced its public
    API's response time by 86%\r\nAt the time of product launch, our most important
    API endpoint was taking around 5 seconds in production. It wasn’t related to tech-stack
    or a particular database/cloud issue nor did we have very bad code quality or
    any N+1 query issues. Instead, it turned out to be the cumulative result of small
    mistakes in some services. In this talk, we will see how we arrive at those mistakes,
    and how you can avoid them earlier on in the development process.\r\n\r\nAbout
    our speaker\r\nRaounak has been working with Ruby for the past 5 years, and actively
    contributing to the Ruby community since 2018. This time has made him focus more
    on the performance of the software. He has implemented and led projects in the
    performance optimization area as a senior software engineer. Recently he has moved
    to Dresden, Germany and is looking forward to meeting new people.\r\n\r\nTalk
    2: TBD\r\nWe'd still love to have another shorter slot (15 minutes), specifically
    intended for 1st time/inexperienced speakers who want to take to the stage for
    a shorter topic.\r\n\r\nAbout our speaker\r\nMaybe you? If you have an idea yourself
    for anything Ruby or at least Ruby-related, get in touch!"
  end_time: '2000-01-01 19:00:00'
