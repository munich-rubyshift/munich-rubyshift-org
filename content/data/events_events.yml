    interested or know someone who might be interested.\r\n\r\nDATE & LOCATION\r\n\r\nDate
    and Time: November 9, from 19:00 CEST (doors open; talks start at 19:30)\r\n\r\nLocation:
    Xempus AG, Arnulfstrasse 126, 80636 Munich, Germany\r\n\r\nAGENDA\r\n\r\n    Welcome
    & Announcements\r\n    Location/Food & Drinks Sponsor Slot\r\n    Food & Drinks
    (sponsored by Xempus)\r\n    Talk 1 incl. Q&A: Using Multiple Databases for Data
    Migrations (Oliver Prater, Xempus)\r\n    Break\r\n    Talk 2 incl. Q&A: TBD\r\n
    \   Socializing (open end/as long as the location permits)\r\n\r\nTALKS\r\n\r\nTalk
    1: Oliver Prater: Using Multiple Databases for Data Migrations\r\nHow we used
    Active Record with multiple databases to migrate a single-tenant application to
