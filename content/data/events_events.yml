Events::Event_969902ff-c7e8-48e5-8d0e-f64c85568e63:
  id: 969902ff-c7e8-48e5-8d0e-f64c85568e63
  attendance_mode: in_person
  banner_background: ''
  channel_id: ''
  date_precision: day
  description: "Dear Munich Rubyists,\r\n\r\nSummer's coming and so is our July meetup!\r\n\r\nWe're
    looking for a company to provide a location and food & drinks -- so if your company
    wants to host this edition of our meetup, please get in touch. We're also looking
    for 1 or 2 speakers -- so if you're up for a talk or know somebody who is, please
    let me know.\r\n\r\nOn a personal note: As I've said before, this event will be
    the last one that I'm organizing. It's time to pass on the baton to someone who's
    still (more) active in the Ruby ecosystem -- so if you're willing to step up,
    drop me a line or talk to me at the meetup.\r\n\r\nLooking forward to seeing you
    all in July!\r\n\r\nDATE & LOCATION\r\n\r\nDate and Time: July 17, from 19:00
    CEST\r\nLocation: Lanes & Planes GmbH, Kap West, Friedenheimer Bruecke 16, 80639
    Munich\r\n\r\nAGENDA\r\n\r\n    Welcome & Announcements\r\n    Location/Food &
    Drinks Sponsor Slot\r\n    Talk 1 incl. Q&A: Aron Wolf: \"Hotwire Native\"\r\n
    \   Talk 2 incl. Q&A: Clemens Helm: \"Using database views in Rails and why you
    should (or shouldn't) do it\"\r\n    Food & Drinks (sponsored by TBD), Socializing
    (open end/as long as the location permits)\r\n\r\nTALKS\r\n\r\nTalk 1: Aron Wolf:
    \"Hotwire Native\"\r\nAn introduction about Hotwire Native. A tool from 37signal
    to convert your fullstack Rails application into a mobile app.\r\nAbout our speaker\r\nhttps://www.meetup.com/members/264213499\r\n\r\nTalk
    2: Clemens Helm: \"Using database views in Rails and why you should (or shouldn't)
    do it\"\r\nComplex data filtering in Rails often leads us down a rabbit hole of
    custom scopes, service objects, and Arel acrobatics. But what if we let the database
    do what it’s best at? In this talk, you’ll see how SQL views paired with plain
    ActiveRecord and Ransack can turn messy logic into elegant, powerful queries —
    without giving up the Rails way.\r\nAbout our speaker\r\nClemens Helm is a seasoned
    Rails developer from Vienna who believes good code is boring — in the best way.
    At railscraft.de, he helps teams modernize legacy Rails apps with clean architecture,
    sharp tools, and zero-nonsense pragmatism."
  end_time: '2000-01-01 20:00:00'
  events_series_id: 1659b292-15b3-4b8a-9f61-3f4359c74e3a
