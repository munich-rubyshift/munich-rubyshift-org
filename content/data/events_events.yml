Events::Event_e0e0c374-65e9-4652-9b0e-22011412a820:
  id: e0e0c374-65e9-4652-9b0e-22011412a820
  attendance_mode: in_person
  banner_background: ''
  channel_id: ''
  date_precision: day
  description: "Dear Rubyists,\r\n\r\nour first Meetup in 2026 will take place on
    January 22nd in AUGSBURG !!!\r\n\r\nAfter opening its gates at Rails World 2025
    in Amsterdam, the Ruby embassy (a \"fun bureaucratic activity\") is opening a
    branch office at our local Meetup group. Take a photo, fill out your application
    forms, grab your Ruby passport and start collecting stamps.\r\n\r\nThe Ruby embassy
    will also issue passports at our future Meetups, although potentially with less
    bureaucracy (i.e. less fun).\r\n\r\nMore details about the Ruby passport: https://therubypassport.notion.site\r\n\r\nAfter
    food & drinks we'll switch over to some talks.\r\n\r\nCALL FOR SPEAKERS:\r\n\r\n
    \   We are still looking for a second talk. Please contact me if you have something
    in mind.\r\n\r\nLooking forward to seeing you all in January!\r\n\r\nDiscord group:
    https://discord.gg/EKqHWmCxGZ]\r\n\r\nDATE & LOCATION\r\n\r\nDate and Time: January
    22nd 2026, 18:30 CEST\r\nLocation: AUGSBURG !!! @makandra\r\n\r\nAGENDA\r\n\r\n
    \   Welcome & Announcements\r\n    18:30 - 19:15 CEST: Office hours of the Ruby
    embassy (Außenstelle Augsburg)\r\n    Apply for your Ruby passport and become
    an \"official\" member of the Ruby community\r\n    Food & Drinks (thanks to makandra)\r\n
    \   Talk 1 incl. Q&A: Henning Koch: \"Limits of Hypermedia\"\r\n    Talk 2 incl.
    Q&A: Call for Speakers is OPEN\r\n    Socializing (open end/as long as the location
    permits)\r\n\r\nTALKS\r\n\r\nTalk 1: Henning Koch: \"Limits of Hypermedia\"\r\nHypermedia
    frameworks like htmx or Unpoly are positioning themselves as simpler alternatives
    to single-page applications. Yet many of us recall earlier server-rendered experiences
    as slow, cumbersome and limited. But just as modern React is unrecognizable from
    its early days, hypermedia frameworks have improved radically over the last decade.
    Today's server-rendered approaches effectively handle UI problems traditionally
    thought to require extensive client-side scripting. At the same time, hypermedia
    apps have some surprising limitations that you might not even have on your radar.\r\nThis
    talk will help you decide whether adopting hypermedia makes sense for your project,
    especially if your experience is mostly with SPAs. We will address questions frontend
    developers typically have:\r\n- Is it possible to achieve the same responsiveness
    that users have come to expect from SPAs?\r\n- How would dynamic forms with dependent
    fields and inline validation work without extensive JavaScript?\r\n- Can server-side
    rendering manage intricate UI interactions, such as multi-step modals, optimistic
    rendering, and client-side state preservation?\r\n- Where does state go when I
    don't have components on the client?\r\nAfter ten years of building both hypermedia
    apps and SPAs, I'm eager to share what works and what doesn't. I hope that by
    the end of my talk you'll know all the trade-offs to decide when hypermedia can
    simplify your stack, and when an SPA remains the better fit.\r\n\r\nAbout our
    speaker https://www.linkedin.com/in/triskweline/"
  end_time: '2000-01-01 19:30:00'
