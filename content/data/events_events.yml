Events::Event_74ad1707-f344-4743-916f-c5c2a89c27bd:
  id: 74ad1707-f344-4743-916f-c5c2a89c27bd
  attendance_mode: in_person
  banner_background: ''
  channel_id: ''
  date_precision: day
  description: "We've got 2 speakers:\r\n\r\nMarco Otto-Witte (https://twitter.com/marcoow):
    Software Engineer and Consultant from Munich. Has strong background in web development
    with Ruby on Rails as well as JavaScript, iOS etc.\r\n\r\nTalk Description: Authentication
    is usually one of the first things everybody comes across when starting a new
    project. While it's pretty much a solved problem in classic Rails applications
    (see devise etc.) things are not as simple when it comes to client side MVC frameworks.
    Ember.SimpleAuth is a library for Ember.js that tries to solve most problems.\r\n\r\nPatrick
    Mulder (https://twitter.com/mulpat): I am very much interested in all things Unix,
    and good OOP (often in Ruby). I am also impressed by the performance of Node.js,
    and new approaches for client-server architectures. I blog at http://thinkingonthinking.com
    and am working currently on a book \"Developing Web Applications with Backbone.js\".\r\n\r\nTalk
    Description: We've got Ruby 2 since some months, Ruby 2.1 just released, and a
    bunch of legacy code bases require some older Ruby versions... that can quickly
    become a mess. In this talk, I want to explore some part of the Ruby ecosystem
    that deals with infrastructure: Chef and Vagrant."
  end_time: '2000-01-01 20:00:00'
  events_series_id: 1659b292-15b3-4b8a-9f61-3f4359c74e3a
