Events::Event_4c25b554-503a-485c-b562-bbf75ec6f1b4:
  id: 4c25b554-503a-485c-b562-bbf75ec6f1b4
  attendance_mode: in_person
  banner_background: ''
  channel_id: ''
  date_precision: day
  description: "Dear Munich Rubyists,\r\n\r\nit's time for 2022 Episode 2.\r\n\r\nDATE
    & LOCATION\r\n\r\nDate and Time: September 8, from 19:00 CEST\r\nLocation: Workpath
    Office, Nymphenburger Straße 86, 80636 Munich\r\n\r\nAGENDA\r\n\r\n    Welcome
    & Announcements (10')\r\n    Location/Food & Drinks Sponsor Slot (5')\r\n    Talk
    1 incl. Q&A: Pavel Grachev: \"Three Things we do well at Workpath\"\r\n    Talk
    2 incl. Q&A: Bogdans Laidins: \"Bringing Confidence with Review Apps\"\r\n    Food
    & Drinks (sponsored by Workpath), Socializing (open end/as long as the location
    permits)\r\n\r\nTALKS\r\nTalk 1: Three Things we do well at Workpath\r\nFeasibility
    studies, refinements, QA, Continuous Delivery — everyone of us knows how the SDLC
    works, we know best practices and we listen to cool smart people speaking at conferences.\r\nPavel
    will share some bits of Workpath's journey as a growing startup trying to apply
    modern methodologies and a bit of common sense. Some learnings that felt surprising,
    what worked for them, and what didn't.\r\nAbout our speaker\r\nPavel Grachev is
    a Team Lead at Workpath.\r\n\r\nTalk 2: Bringing Confidence with Review Apps\r\nReview
    Apps provide a fully functional preview of feature branch changes, creating an
    ephemeral environment for your merge requests. This allows designers, product
    owners, QA and other stakeholders to get involved in the feedback process as quickly
    as possible, improving the fidelity and speed of review. DataGuard's road to adoption
    of Review Apps began with an open source alternative to Heroku, moving on to using
    Humanitec, a full-fledged platform orchestrator.\r\nAbout our speaker\r\nBogdans
    Laidins is a Lead Engineer at DataGuard."
  end_time: '2000-01-01 19:00:00'
