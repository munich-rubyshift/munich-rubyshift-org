  description: "This time we will have again very interesting speakers and topics.\r\nWe
    sincerly hopy you will join us for this cool event.\r\n\r\nIntroduction to ArangoDB\r\n\r\nArangoDB
    is an open source NoSQL database which is not narrow-mindedly focused on horizontal
    scalability. Instead, ArangoDB aims to offer developers great flexibility and
    ease-of-use. The database is suitable for use cases which are difficult to implement
    with most traditional relational databases and also many of the other NoSQL databases.\r\n\r\nBy
    Lucas Dohmen @moonbeamlabs\r\n\r\nI’m a member of the core team of the NoSQL database
    project ArangoDB where I work on the graph functionality, tools for the Ruby community
    to use the database and Foxx. Furthermore I contribute to various open source
    projects like hacken.in (http://hacken.in/) (an event calender for nerds in my
    hometown written in Rails) and projects related to ArangoDB. You can find me listening
    or speaking at our local usergroups for Ruby, JavaScript, NoSQL and (as a coach
    for) Rails Girls.\r\n\r\nHow to look like a model: MongoDB for Rails projects\r\n\r\nThis
    talk covers main concepts of document-oriented data model, pros and contras considering
    MongoDB and how to use this database together with Ruby-on-Rails\r\n\r\nBy Anna
    Bulenkova @povergo\r\n\r\nI've been working at JetBrains for almost 5 years for
    now and during all this time I've been involved in development of Ruby-on-Rails
    IDE. The main goal of our team is to help Ruby programmers code more effective
    and improve the quality of code.\r\n\r\nPUT Knowledge BUCKET Brain KEY Riak\r\n\r\nA
    introduction and a demo to Riak and its Ruby bindings.\r\n\r\nPhillipp Fehre @ischi\r\n\r\nPhil
    is your local and friendly ruby and javascript coder, working for his company
    Cospired."
