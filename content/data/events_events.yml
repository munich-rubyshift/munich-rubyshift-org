Events::Event_71a42ab5-d65d-4686-9bf6-7238a6719d66:
  id: 71a42ab5-d65d-4686-9bf6-7238a6719d66
  attendance_mode: in_person
  banner_background: ''
  channel_id: ''
  date_precision: day
  description: "Our next meetup will be especially fun!\r\n\r\nEvery attendee has
    an option to hold a lightning talk (5 minutes) during the user group. If you absolutely
    can not (do not want) to give a talk, you can opt-out, just let us know. If you
    need any help, to select a gem, find enough information, prepare slides, test-drive
    the talk, or anything else talk-related let us know, we'll willingly help you
    out! Remember, it's just 5 minutes, and trust us - it will be just great!\r\n\r\nSpeaking
    publicly is always good for you. You can learn so many things while preparing
    for a (even for a short) talk. Talk delivery skills are also extremely important
    for professionals. Practicing it will bring you to absolutely new level of communication
    with your peers.\r\n\r\nThe Gem you are speaking about has to start with a alphabetic
    letter that is assigned to you (the speakers) randomly. The attendees of our last
    meetup already have one assigned.\r\n\r\nIf you don't have one yet ping us we
    will assign one to you.\r\n\r\nLets define some rules:\r\n\r\nIf your Gem is a
    lesser known Gem (less than 1million downloads on Rubygems.org) make a high level
    introduction to it. If you speak about a well known Gem like eg JSON 1.8.0 tell
    us about one particular interesting internal aspect (remember you have max 5min)
    If you want to make it easy for yourself and create your own Gem we expect you
    to explain to us the process of creating your own Gems. If you want to make it
    very easy for you and simply fork a Gem on Github you will have to make presentation
    about Git and Github and the process of forking ;-) OR\r\nYou will have to make
    a presentation about why and what exactly you have changed in your fork and why
    a pull request didn't cut the mustard. So we expect some serious meat here ;-)
    At the end of all the talks we will do a voting MSDRGPS (München sucht den Ruby
    Gems Presentation Superstar) and the top 3 speakers will get a RubyMine License
    (or Upgrade) sponsored by JetBrains.\r\n\r\nPlease send me the name of the Gem
    you will talk about until Monday, July 1st so we can put the list of speakers
    and topics on our website.\r\n\r\nSend your actual presentation up until Monday,
    July 8th in PDF form or MP4 (if its some screen cast).\r\n\r\nWe will prepare
    all presentations on single computer so we do not waste time for connecting and
    disconnecting different hardware.\r\n\r\nWe absolute prefer presentations about
    lesser known Gems and internals of well known Gems. For the other categories we
    will only allow one presentation each (first come, first serve).\r\n\r\nThis might
    be a longer evening, therefore we will start our talks and our introduction round
    at 19:30. please be in time and we will make sure that pizza and beverages are
    there at 19:00.\r\n\r\nLooking forward to this event\r\n\r\nAlex & Robert"
  end_time: '2000-01-01 20:00:00'
