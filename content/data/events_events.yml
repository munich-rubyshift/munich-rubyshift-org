Events::Event_e6c4cb5e-4d7f-4cf6-96b1-18691856aa88:
  id: e6c4cb5e-4d7f-4cf6-96b1-18691856aa88
  attendance_mode: in_person
  banner_background: ''
  channel_id: ''
  date_precision: day
  description: "Dear Rubyists,\r\n\r\nthe spring is coming closer and so our next
    meetup in April!\r\n\r\nThe meetup will take place on Freeletics at 18:30. Here
    a big thanks to Khaled to be our contact person!\r\n\r\nLooking forward to see
    you all in April!\r\n\r\nDiscord group: https://discord.gg/EKqHWmCxGZ\r\n\r\nCALL
    FOR SPEAKERS:\r\n\r\n    We are still looking for a second talk. Please contact
    me if you have something in mind.\r\n\r\nDATE & LOCATION\r\n\r\nDate and Time:
    April 23nd 2026, 19:00 CEST\r\nLocation: Freeletics\r\n\r\nAGENDA\r\n\r\n    Welcome
    & Announcements\r\n    Location/Food & Drinks Sponsor Slot\r\n    Talk 1 incl.
    Q&A: Hans Schnedlitz; \"Gems Are Overrated: or How I Learned to Stop Worrying
    and Love Copy-Pasting\"\r\n    Talk 2 incl. Q&A: Klaus Weidinger: \"munich-rubyshift.org
    goes live!\"\r\n    How I Learned to Stop Worrying and Love Copy-Pasting\"\r\n
    \   Food & Drinks (sponsored by TBD), Socializing (open end/as long as the location
    permits)\r\n\r\nTALKS\r\n\r\nTalk 1 Hans Schnedlitz: \"Gems Are Overrated: or
    How I Learned to Stop Worrying and Love Copy-Pasting\"\r\nWhen I started working
    with Ruby, I embraced its rich ecosystem. My Gemfile for any new project immediately
    grew longer than Gandalf's beard. Unfortunately, using Gems comes with downsides.
    On the practical side, pulling in third-party libraries exposes your app to supply-chain
    attacks that are increasingly common. However, what's even worse is that most
    Gems are pure bloatware. They add thousands of lines of code you'll never need,
    and churn constantly.\r\nThe alternative, obviously, is to build everything from
    scratch. In this talk, we'll look at some examples of how some well-known gems
    can be boiled down to a single file that you can copy-paste to any new project.
    We'll also look at the limits of this approach, and when you actually should reach
    for that Gem.\r\n\r\nAbout our speaker https://www.linkedin.com/in/hschne\r\n\r\nTalk
    2 Klaus Weidinger: \"munich-rubyshift.org goes live!\"\r\nIn this demo-heavy \"talk
    & deploy\" I do a classic Ruby on Rails speedrun. How fast can you get from an
    empty git repo to a deployed website?\r\n\r\nHowever, nothing is as it seems.
    While frantically switching between slides and code editor, I will reveal and
    explain my two new gems and will use them to turn a new Ruby on Rails project
    into a very weird static site generator.\r\n\r\nWe'll create the initial DB tables
    and add some records ... wait, what? Database tables? In a static site generator???
    Yes, you heard me right!\r\n\r\nAfterwards, we'll have our tiny release party!
    At least, if the internet connection is stable. Wish me luck!\r\n\r\nAbout the
    speaker https://www.linkedin.com/in/klaus-weidinger-a37a27332/"
