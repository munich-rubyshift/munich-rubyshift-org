openapi: 3.1.1
info:
  title: Munich Rubyshift
  version: v1
  summary: >-
    The events of the Munich Rubyshift meetup, their talks, people,
    organizations and places.
  description: >
    The data behind [munich-rubyshift.org](https://munich-rubyshift.org) as
    static JSON files,

    rebuilt whenever the website is. The documents follow [JSON:API
    1.1](https://jsonapi.org/format/1.1/),

    with these simplifications:


    - Only `GET` requests. There are no query parameters, so no filtering,
    sorting, `include` or
      sparse fieldsets.
    - Lists come in pages: follow `links.next` until it is `null`. For now,
    every list fits on one
      page.
    - The files are served as `application/json`, since the static host picks
    the media type.


    Conventions:


    - A resource's `id` is its UUID, which never changes. Records refer to each
    other through
      relationships, by `type` and `id`. An event's document includes the records that belong to it,
      like its venue and talks. Look up the others in the list for their type, like `/people.json` for
      `people`, and an event at `/events/{id}.json`.
    - `slug` names a record in the URLs of our website.
    - Attributes hold the values that apply, with fallbacks resolved, like an
    event's website falling
      back to its series'. The attribute says where a value falls back to. All keys are always
      present, and `null` means we don't know or it doesn't apply.
    - Long texts are Markdown, limited to paragraphs, line breaks, links,
    emphasis, inline code, lists
      and two levels of headings.
servers:
  - url: /api/v1
tags:
  - name: Global data
    description: The people, organizations and cities that all series share.
  - name: Series data
    description: The series, and their events with the records that belong to them.
paths:
  /events/{id}.json:
    $ref: paths/events_{id}.json.yaml
  /series.json:
    $ref: paths/series.json.yaml
  /people.json:
    $ref: paths/people.json.yaml
  /organizations.json:
    $ref: paths/organizations.json.yaml
  /cities.json:
    $ref: paths/cities.json.yaml
