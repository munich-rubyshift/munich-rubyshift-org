  - data
  - included
properties:
  jsonapi:
    $ref: ./JsonApi.yaml
  data:
    $ref: ./Event.yaml
  included:
    type: array
    items:
      oneOf:
        - $ref: ./Venue.yaml
        - $ref: ./Address.yaml
        - $ref: ./Talk.yaml
        - $ref: ./SponsorTier.yaml
        - $ref: ./Sponsorship.yaml
        - $ref: ./Involvement.yaml
        - $ref: ./CFP.yaml
additionalProperties: false
